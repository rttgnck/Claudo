<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claudo · Pulse — a browser groovebox</title>
  <meta name="description" content="A full browser groovebox: a synthesized drum kit, bass and lead synths, per-track mixer, master FX, an 8-slot pattern bank, WAV export, and shareable links. Make a beat in your browser." />
  <meta name="theme-color" content="#07070c" />
  <meta property="og:title" content="Claudo · Pulse" />
  <meta property="og:description" content="A browser groovebox — drums, bass & lead synths, FX, pattern bank, and WAV export. Make a beat and share it." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='11' cy='13' r='5' fill='%23f472b6'/><circle cx='21' cy='19' r='5' fill='%2338bdf8'/><circle cx='19' cy='9' r='4' fill='%23ffd166'/></svg>" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/pulse.css" />
</head>
<body>
  <div class="bg-gradient"></div>

  <header id="topbar">
    <div id="logo" class="logo">
      <span class="dot d1" style="background:#f472b6;color:#f472b6"></span><span class="dot d2" style="background:#38bdf8;color:#38bdf8"></span><span class="dot d3" style="background:#ffd166;color:#ffd166"></span>
      <span class="word">Claudo</span><span class="page-tag">Pulse</span>
    </div>
    <div class="actions">
      <button id="mode3dBtn" class="btn" title="Switch between 2D and 3D">⬗ 3D</button>
      <button id="panelToggle" class="btn ghost only-narrow" title="Toggle panel">⚙</button>
    </div>
  </header>

  <div id="transport"></div>

  <div id="workspace">
    <div id="seqScroll"><div id="seq"></div></div>
    <aside id="sidePanel"></aside>
  </div>

  <div id="toast"></div>

  <script type="module" src="js/pulse.js"></script>
</body>
</html>
